# Injects a stylesheet into Authelia's login page.
#
# Authelia 4.39 has no supported way to add custom CSS: server.asset_path only
# covers the favicon and logo, and a file dropped there is served as the SPA's
# fallback HTML rather than as CSS. So the page is passed through nginx, which
# rewrites the closing </head> to include one extra stylesheet.
#
# sub_filter only touches text/html, so the SPA's JS and CSS bundles pass
# through untouched.

server {
    listen 80;
    server_name _;

    # Served by this layer rather than proxied, so it exists regardless of what
    # Authelia does with unknown paths.
    location = /theme-override.css {
        alias /usr/share/nginx/theme/custom.css;
        add_header Content-Type text/css;
    }

    location / {
        proxy_pass http://authelia:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream compression would make the response opaque to sub_filter.
        proxy_set_header Accept-Encoding "";

        sub_filter '</head>' '<link rel="stylesheet" href="/theme-override.css"></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
